<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title> DevScope</title>
</head>
<body class="bg-slate-950 ">
    <header class="bg-slate-700/30 my-5 mx-40 flex justify-between border-1 border-gray-300 rounded-xl h-13">
        <p class="font-medium text-stone-50 self-center font-serif"><span class="text-xs bg-cyan-500 mx-3 px-2 rounded-full shadow-lg shadow-cyan-500/50 "></span>DevScope</p>
        <nav class="self-center mr-5">
            <ul class="flex font-serif text-gray-50 font-light gap-5 justify-center self-center">
                <li><a href="#Recherche" class="text-blue-500">Recherche</a></li>
                <li><a href="shortlist.html" >Shortlist</a></li>
            </ul>
        </nav>
    </header>
    <main id="Recherche">
        <h1 class="text-6xl text-gray-50 mt-20 font-semibold text-center ">Trouvez les meilleurs <br> développeurs grace à <span class="bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 bg-clip-text text-transparent">leur <br>code</span></h1>
        <p class="text-xl text-center text-gray-500 font-medium">Analysez un <span class="text-blue-500">profil</span>, ses <span class="text-orange-400">projets</span> et ses <span class="text-pink-500">langages</span> en <br>quelques secondes</p>
        <div class="bg-slate-700/30 my-5 mx-75 flex justify-between border-1 border-gray-600 rounded-xl shadow-xl h-13">
            <i class="fa-solid fa-magnifying-glass text-2xl text-blue-500 self-center ml-2"></i>
            <input type="text" placeholder="Entrez un nom d'utilisateur..." class="h-12 w-120 mx-3" id="Rechercher">
            <button class="bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 rounded-lg h-9 self-center text-gray-50 text-shadow-2xs mr-2 px-2 cursor-pointer" id="Analyser">Analyser --&#62;</button>
        </div>
    </main>

</html>
